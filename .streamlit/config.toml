# Server copy: listens on all interfaces inside the container; docker publishes it to the home LAN only.
# Private photos: never forward this port on the router.
[server]
address = "0.0.0.0"
port = 8501
headless = true
enableStaticServing = true  # static/: the Onest font, so the UI works offline

# Light table: a lit surface (main), a graphite frame (sidebar), grease pencil yellow marks what you picked
[[theme.fontFaces]]
family = "onest"
url = "app/static/Onest.ttf"

[theme]
base = "light"
font = "onest"
backgroundColor = "#E6EAEE"
secondaryBackgroundColor = "#D9DEE4"
textColor = "#1D2024"
primaryColor = "#24272B"
borderColor = "#CDD3DA"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#24272B"
secondaryBackgroundColor = "#33373C"
textColor = "#E6E8EB"
primaryColor = "#F2B705"
borderColor = "#3E4248"

[browser]
gatherUsageStats = false
